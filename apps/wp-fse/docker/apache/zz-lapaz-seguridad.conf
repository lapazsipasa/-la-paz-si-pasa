# zz-: carga después del security.conf de Debian, que fija ServerTokens OS.

# Sin firma de versión de Apache en errores y cabeceras.
ServerSignature Off
ServerTokens Prod

# XML-RPC no se usa (lapaz-limpieza.php lo desactiva en WordPress). Se bloquea aquí
# para que ni siquiera arranque PHP: es un blanco habitual de fuerza bruta.
<Files "xmlrpc.php">
    Require all denied
</Files>

# Sin listado de directorios.
<Directory "/var/www/html">
    Options -Indexes
</Directory>

# Archivos que revelan la versión de WordPress o datos de depuración.
<FilesMatch "^(readme\.html|license\.txt|wp-config-sample\.php|debug\.log)$">
    Require all denied
</FilesMatch>

# Nunca ejecutar PHP desde uploads: si alguien lograra subir un .php, no correría. La regex
# cubre variantes (.php8, .phtml, .pht, .phps, .shtml) y dobles extensiones (x.php.jpg), que
# mod_php también ejecutaría. php_flag engine off es la segunda barrera.
<Directory "/var/www/html/wp-content/uploads">
    <FilesMatch "(?i)\.(php[0-9]*|phtml|phar|pht|phps|shtml)(\.|$)">
        Require all denied
    </FilesMatch>
    <IfModule mod_php.c>
        php_flag engine off
    </IfModule>
</Directory>

# Traducciones (WordPress y plugins): PHP las lee del disco, nunca se sirven ni ejecutan por HTTP.
<Directory "/var/www/html/wp-content/languages">
    <FilesMatch "(?i)\.(php[0-9]*|phtml|phar|pht|phps|shtml|mo|po)(\.|$)">
        Require all denied
    </FilesMatch>
    <IfModule mod_php.c>
        php_flag engine off
    </IfModule>
</Directory>

# Definiciones de campos SCF: no son públicas.
<DirectoryMatch "^/var/www/html/wp-content/scf-json">
    Require all denied
</DirectoryMatch>

# Cabeceras de seguridad.
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"

    # HSTS solo si el visitante llegó por HTTPS (Traefik envía X-Forwarded-Proto). Sin
    # includeSubDomains a propósito: otros subdominios podrían seguir en HTTP.
    Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTP:X-Forwarded-Proto} == 'https'"

    # CSP activa en el sitio público. Lo que permite y cómo sumar un servicio: wiki/despliegue-fse.md (CSP).
    # 'unsafe-inline' en script-src: WordPress imprime en <head> el import map y las reglas de especulación
    # sin nonce, y un nonce por petición no sirve con la caché de página. lapaz-seguridad.php cierra el resto:
    # una <meta> al final del <head> suma una segunda política sin 'unsafe-inline' para todo lo que viene
    # después (contenido, inyecciones, javascript:). script-src-attr 'none': ni onclick= ni otros atributos.
    # 'wasm-unsafe-eval': el router de la Interactivity API (catálogo) compila WebAssembly; no habilita eval de JS.
    # YouTube: los iframes propios usan youtube-nocookie.com, pero Plyr (/proyectos-destacados/) carga
    # www.youtube.com/iframe_api (script) y crea su marco en www.youtube.com (noCookie:false por defecto),
    # lee el título por fetch en noembed.com (connect-src) y las miniaturas en i.ytimg.com.
    # Google Tag Manager y GA4 (lapaz-gtm.php, solo producción): googletagmanager.com, google-analytics.com,
    # analytics.google.com y www.google.com, según developers.google.com/tag-platform/security/guides/csp.
    # Todo lo demás, local. El admin y el login llevan una política mínima: el editor necesita blob:, eval y más.
    <If "%{REQUEST_URI} !~ m#^/wp-(admin|login\.php)#">
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.youtube.com https://*.googletagmanager.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' https://i.ytimg.com https://*.google-analytics.com https://*.googletagmanager.com; media-src 'self'; font-src 'self'; connect-src 'self' https://noembed.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://www.google.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; worker-src 'none'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'"
        # Segunda política, solo tras HTTPS (como HSTS): en local por HTTP subiría los recursos a https.
        # Va dentro del <If>: Apache aplica estos bloques al final y su «set» borraría un «add» de fuera.
        Header always add Content-Security-Policy "upgrade-insecure-requests" "expr=%{HTTP:X-Forwarded-Proto} == 'https'"
    </If>
    <Else>
        Header always set Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    </Else>
</IfModule>
